     <h1>Sistemas, reglas y variación</h1>
         <p>
            El trabajo de Casey Reas se fundamenta en la idea de que una obra puede ser entendida como un <em>sistema de reglas.</em> 
            Estas reglas definen las posibles interacciones entre los elementos visuales, permitiendo que la obra se genere a partir de su ejecución.
